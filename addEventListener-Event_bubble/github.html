<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="secret">My secret info</h1>
    <input type="text" id="text-contain" placeholder="please input delete">
    <button id="btn-delete" disabled>Delete</button>
    <script>
        document.getElementById('text-contain').addEventListener('keyup',function(event){
            const text =event.target.value;
            const deleteButton = document.getElementById('btn-delete')
            if(text === 'delete'){
                deleteButton.removeAttribute('disabled');
            }
            else{
                deleteButton.setAttribute('disabled',true);
            }

        })
        document.getElementById('btn-delete').addEventListener('click',function(){
            const secret = document.getElementById('secret');
            secret.style.display ='none';

        })
    </script>
</body>
</html>
