<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Final dom event handelers</h1>
    <h3 id="handStatus">Default text</h3>
    <p>Input text</p>
    <input id="input-field" type="text">
    <button id="btn-update">Update</button>
    <br><br>
    <button onclick="handleOnClick()">Add onclick function</button>
    <button id="button2">Handle new button</button>
    <script>
        function handleOnClick(){
            const handel = document.getElementById('handStatus');
            handel.innerText ='Handled by function attached on clicked attribute'
            console.log('button clicked')
        }
        // option-2
        document.getElementById('button2').addEventListener('click',function(){
            const handel = document.getElementById('handler-status');
            handel.innerText ='text updated by add event listener button'
        })

        // option-2 recape----------
        document.getElementById('btn-update').addEventListener('click',function(){
            const inputField = document.getElementById('input-field');
            console.log(inputField)
        })
    </script>
</body>
</html>
